<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Moe's Barbershop logo">
  <defs>
    <path id="topArc" d="M 130 300 A 170 170 0 0 1 470 300" />
    <path id="bottomArc" d="M 120 300 A 180 180 0 0 0 480 300" />
  </defs>

  <!-- Background -->
  <circle cx="300" cy="300" r="300" fill="#f0e4cc"/>

  <!-- Rings -->
  <circle cx="300" cy="300" r="278" fill="none" stroke="#5a2d20" stroke-width="14"/>
  <circle cx="300" cy="300" r="252" fill="none" stroke="#e0922f" stroke-width="12"/>

  <!-- MOE'S text -->
  <text x="300" y="215" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="120" letter-spacing="2" fill="#5a2d20">MOE&#8217;S</text>

  <!-- Crossed scissors + razor -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Scissors (\ direction) -->
    <g stroke="#5a2d20" fill="none" stroke-width="9">
      <line x1="228" y1="250" x2="360" y2="400"/>
      <circle cx="218" cy="244" r="14" stroke-width="9"/>
    </g>
    <!-- Razor (/ direction) -->
    <g>
      <rect x="362" y="232" width="22" height="120" rx="8"
            transform="rotate(40 373 292)" fill="#e0922f" stroke="#5a2d20" stroke-width="5"/>
      <rect x="244" y="332" width="120" height="20" rx="8"
            transform="rotate(40 304 342)" fill="#f0e4cc" stroke="#5a2d20" stroke-width="5"/>
    </g>
  </g>

  <!-- Mustache -->
  <path d="M 300 388
           C 268 372, 246 374, 232 392
           C 224 402, 210 404, 204 396
           C 214 414, 240 422, 262 412
           C 278 405, 290 402, 300 408
           C 310 402, 322 405, 338 412
           C 360 422, 386 414, 396 396
           C 390 404, 376 402, 368 392
           C 354 374, 332 372, 300 388 Z"
        fill="#e0922f"/>

  <!-- BARBERSHOP arc -->
  <text font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="72" letter-spacing="3" fill="#5a2d20">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">BARBERSHOP</textPath>
  </text>

  <!-- Flourish -->
  <g stroke="#e0922f" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M 250 520 q 20 -22 40 -2 q 10 12 0 22 q -8 8 -14 -2 q -4 -8 6 -10"/>
    <path d="M 350 520 q -20 -22 -40 -2 q -10 12 0 22 q 8 8 14 -2 q 4 -8 -6 -10"/>
    <line x1="240" y1="522" x2="200" y2="522"/>
    <line x1="360" y1="522" x2="400" y2="522"/>
  </g>
</svg>
